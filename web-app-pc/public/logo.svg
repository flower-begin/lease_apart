    <ellipse cx="134" cy="159" rx="9" ry="4.4" transform="rotate(-28 134 159)"/>
    <ellipse cx="141" cy="152" rx="9" ry="4.4" transform="rotate(-44 141 152)"/>
    <ellipse cx="147" cy="144" rx="8.2" ry="4" transform="rotate(-58 147 144)"/>
    <ellipse cx="151" cy="135" rx="7" ry="3.4" transform="rotate(-70 151 135)"/>
    <ellipse cx="128" cy="152" rx="8.4" ry="4.2" transform="rotate(12 128 152)"/>
    <ellipse cx="134" cy="144" rx="8.2" ry="4" transform="rotate(-6 134 144)"/>
    <ellipse cx="140" cy="136" rx="7.2" ry="3.6" transform="rotate(-22 140 136)"/>
  </g>

  <!-- ==================== 橄榄枝（左，镜像） ==================== -->
  <g transform="translate(200 0) scale(-1 1)" fill="#8E9A7A">
    <path d="M129 166 C136 156 143 146 150 133" stroke="#8E9A7A" stroke-width="2.2" fill="none"
